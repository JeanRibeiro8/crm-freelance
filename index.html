<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CRM Freelancer</title>

      <!-- FAVICON -->
<link rel="icon" type="image/png" href="icon.png">

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="./src/style/style.css">
</head>

<body class="bg-light">

  <!-- Header -->

  <header class="bg-dark text-white py-3 shadow-sm">
    <div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center">

      <a href="./index.html" class="text-decoration-none text-reset">
    <h1 class="h4 m-0">
      CRM Freelancer
    </h1> </a>

    <span class="badge text-bg-secondary p-2">
      JR Freelancer
    </span>

  </div>

</div>

  </header>

  <!--dashboard-->

<section class="dashboard">
<div class="stat-card">
    <h3>Clients</h3>
    <p>0</p>
</div>

<div class="stat-card">
    <h3>Active Projects</h3>
    <p>0</p>
</div>

<div class="stat-card">
    <h3>Projected revenue</h3>
    <p>R$ 0</p>
</div>

</section>

  <!-- Content -->

  <main class="container py-4">

<div class="mb-4">
  
<a
  href="./createProject.html"
  class="btn btn-primary"
>
  <i class="bi bi-plus-lg"></i>
  New Project
</a>

</div>

<!-- Colum -->

<div class="row">

  <div class="col-md-4">

    <div class="bg-body-secondary rounded p-3">

      <h2 class="h6 fw-bold mb-3">
        Projects
      </h2>

      <!-- Card -->
       <div id="projectList"></div>

      <div id="projectCard" class="card shadow-sm">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-start">

            <h3 class="h6 mb-0">
              Client Name
            </h3>

            <!--remove space-->
            <!--delete-->
<div class="gap-0">

            <button
            id="deleteBtn"
              class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-trash"></i> 
            </button>


            <button
              class="btn btn-sm btn-outline-secondary">
             
<a class="text-decoration-none text-reset" 
href="./editProject.html">
              <i class="bi bi-pencil"></i> 
            </a>
            </button>

            </div>

          </div>

          <p class="text-muted mt-2 mb-1">
            Title Project
          </p>

          <p class="small mb-3">
            Description
          </p>

          <span
            class="badge text-bg-success">

            R$ 0

          </span>

<label class="form-label"></label>

<select id="projectStatus" class="form-select">

<!--Change color-->
    <option value="development">
        Development
    </option>

    <option value="delivered">
        Delivered
    </option>

    <option value="paid">
        Paid
    </option>

</select>

        </div>

      </div>

    </div>

  </div>

</div>

  </main>
  
  <script src="./src/js/app.js"></script>
</body>
</html>
